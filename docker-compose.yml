version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kitabqurdu-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-kitabqurdu}
      POSTGRES_USER: ${DB_USERNAME:-kitabqurdu}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kitabqurdu}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kitabqurdu-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kitabqurdu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kitabqurdu-backend
    environment:
      SPRING_PROFILE: ${SPRING_PROFILE:-dev}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kitabqurdu}
      DB_USERNAME: ${DB_USERNAME:-kitabqurdu}
      DB_PASSWORD: ${DB_PASSWORD:-kitabqurdu}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-this-in-production-must-be-at-least-256-bits}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:4200,http://localhost:3000}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:4200}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - kitabqurdu-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kitabqurdu-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
    networks:
      - kitabqurdu-network

networks:
  kitabqurdu-network:
    driver: bridge

volumes:
  postgres_data:
