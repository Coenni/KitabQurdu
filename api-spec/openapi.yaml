openapi: 3.0.3
info:
  title: KitabQurdu API
  description: Second-hand Book Marketplace API
  version: 1.0.0
  contact:
    name: KitabQurdu Team
    email: support@kitabqurdu.az

servers:
  - url: http://localhost:8080/api
    description: Local development server
  - url: https://stage-api.kitabqurdu.az/api
    description: Staging server
  - url: https://api.kitabqurdu.az/api
    description: Production server

tags:
  - name: Authentication
    description: User authentication and authorization
  - name: Posts
    description: Book listing operations
  - name: Users
    description: User management
  - name: Autocomplete
    description: Search autocomplete

security:
  - BearerAuth: []

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register a new user
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Authentication
      summary: Login with credentials
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts:
    get:
      tags:
        - Posts
      summary: Get all posts
      operationId: getAllPosts
      security: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            default: createdAt
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [ASC, DESC]
            default: DESC
      responses:
        '200':
          description: List of posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePost'

    post:
      tags:
        - Posts
      summary: Create a new post
      operationId: createPost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Post created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /posts/search:
    get:
      tags:
        - Posts
      summary: Search posts with filters
      operationId: searchPosts
      security: []
      parameters:
        - name: query
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: city
          in: query
          schema:
            type: string
        - name: minPrice
          in: query
          schema:
            type: number
        - name: maxPrice
          in: query
          schema:
            type: number
        - name: condition
          in: query
          schema:
            type: string
            enum: [NEW, LIKE_NEW, VERY_GOOD, GOOD, ACCEPTABLE]
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePost'

  /posts/featured:
    get:
      tags:
        - Posts
      summary: Get featured posts
      operationId: getFeaturedPosts
      security: []
      responses:
        '200':
          description: Featured posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PostDto'

  /posts/{id}:
    get:
      tags:
        - Posts
      summary: Get post by ID
      operationId: getPostById
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Post details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'
        '404':
          description: Post not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Posts
      summary: Update post
      operationId: updatePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostRequest'
      responses:
        '200':
          description: Post updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDto'

    delete:
      tags:
        - Posts
      summary: Delete post
      operationId: deletePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: Post deleted

  /users/me:
    get:
      tags:
        - Users
      summary: Get current user
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDto'

  /autocomplete/books:
    get:
      tags:
        - Autocomplete
      summary: Search books
      operationId: searchBooks
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Book suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /autocomplete/authors:
    get:
      tags:
        - Autocomplete
      summary: Search authors
      operationId: searchAuthors
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Author suggestions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    RegisterRequest:
      type: object
      required:
        - username
        - email
        - password
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 50
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6
        firstName:
          type: string
        lastName:
          type: string

    LoginRequest:
      type: object
      required:
        - usernameOrEmail
        - password
      properties:
        usernameOrEmail:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
          default: Bearer
        user:
          $ref: '#/components/schemas/UserDto'

    UserDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phoneNumber:
          type: string
        imageUrl:
          type: string
        provider:
          type: string
        role:
          type: string

    PostRequest:
      type: object
      required:
        - title
        - price
        - condition
        - city
      properties:
        title:
          type: string
        description:
          type: string
        authorName:
          type: string
        bookTitle:
          type: string
        genre:
          type: string
        price:
          type: number
        condition:
          type: string
          enum: [NEW, LIKE_NEW, VERY_GOOD, GOOD, ACCEPTABLE]
        city:
          type: string
        area:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        images:
          type: array
          items:
            type: string

    PostDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user:
          $ref: '#/components/schemas/UserDto'
        title:
          type: string
        description:
          type: string
        authorName:
          type: string
        bookTitle:
          type: string
        genre:
          type: string
        price:
          type: number
        condition:
          type: string
        city:
          type: string
        area:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        images:
          type: array
          items:
            type: string
        status:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PagePost:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/PostDto'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        size:
          type: integer
        number:
          type: integer

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
        status:
          type: integer
